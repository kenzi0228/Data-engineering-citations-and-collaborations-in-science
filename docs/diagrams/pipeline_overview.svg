<line x1="685" y1="455" x2="685" y2="545" class="arrow"/>
<line x1="1020" y1="455" x2="1020" y2="545" class="arrow"/>
<line x1="480" y1="605" x2="560" y2="605" class="arrow2"/>
<line x1="810" y1="605" x2="890" y2="605" class="arrow2"/>
</svg>