<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<style>
    .title { font: 700 24px Arial, sans-serif; fill: #1f2937; }
    .subtitle { font: 400 13px Arial, sans-serif; fill: #4b5563; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 14; ry: 14; }
    .box2 { fill: #eef6ff; stroke: #1d4ed8; stroke-width: 2; rx: 14; ry: 14; }
    .box3 { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 14; ry: 14; }
    .box4 { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 14; ry: 14; }
    .small { font: 600 16px Arial, sans-serif; fill: #111827; }
    .body { font: 400 13px Arial, sans-serif; fill: #374151; }
    .mono { font: 400 12px 'Courier New', monospace; fill: #374151; }
    .arrow { stroke: #475569; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
    .arrow2 { stroke: #1d4ed8; stroke-width: 2.6; fill: none; marker-end: url(#arrowBlue); }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/>
  </marker>
</defs>

<text x="40" y="45" class="title">Repository Architecture</text>
<text x="40" y="72" class="subtitle">How source modules, scripts, data folders, outputs and tests fit together.</text>

<rect x="60" y="120" width="280" height="250" class="box"/>
<text x="78" y="148" class="small">src/citation_graphs</text>
<text x="78" y="168" class="body">Core Python package</text>
<text x="78" y="186" class="body">normalization.py</text>
<text x="78" y="204" class="body">filtering.py / graph_builder.py</text>
<text x="78" y="222" class="body">graph_analysis.py / data_quality.py</text>
<text x="78" y="240" class="body">reporting.py / manifests.py / utils.py</text>


<rect x="390" y="120" width="280" height="250" class="box2"/>
<text x="408" y="148" class="small">scripts/</text>
<text x="408" y="168" class="body">CLI entry points</text>
<text x="408" y="186" class="body">inspect_raw.py</text>
<text x="408" y="204" class="body">normalize_dataset.py</text>
<text x="408" y="222" class="body">filter_dataset.py</text>
<text x="408" y="240" class="body">build_graph.py / analyze_graph.py</text>
<text x="408" y="258" class="body">export_analysis_report.py</text>


<rect x="720" y="120" width="300" height="250" class="box3"/>
<text x="738" y="148" class="small">data/</text>
<text x="738" y="168" class="body">raw/ : original source</text>
<text x="738" y="186" class="body">interim/ : normalized parquet</text>
<text x="738" y="204" class="body">processed/ : subsets</text>
<text x="738" y="222" class="body">reference/ : FOS index</text>
<text x="738" y="240" class="body">sample/ : demo parquet files</text>


<rect x="1070" y="120" width="320" height="250" class="box4"/>
<text x="1088" y="148" class="small">outputs/</text>
<text x="1088" y="168" class="body">inspection/</text>
<text x="1088" y="186" class="body">graphs/ and metrics/</text>
<text x="1088" y="204" class="body">quality/ and exports/</text>
<text x="1088" y="222" class="body">reports/ and manifests/</text>
<text x="1088" y="240" class="body">Reusable analytical artifacts</text>


<rect x="220" y="470" width="300" height="220" class="box2"/>
<text x="238" y="498" class="small">app/</text>
<text x="238" y="518" class="body">streamlit_app.py</text>
<text x="238" y="536" class="body">UI for orchestration and exploration</text>
<text x="238" y="554" class="body">Calls CLI scripts</text>
<text x="238" y="572" class="body">Displays summaries, insights</text>
<text x="238" y="590" class="body">Exports markdown reports</text>


<rect x="620" y="470" width="330" height="220" class="box3"/>
<text x="638" y="498" class="small">tests/</text>
<text x="638" y="518" class="body">pytest-based validation</text>
<text x="638" y="536" class="body">fixtures/mini_records.json</text>
<text x="638" y="554" class="body">test_filtering.py</text>
<text x="638" y="572" class="body">test_graph_builder.py</text>
<text x="638" y="590" class="body">test_graph_analysis.py</text>
<text x="638" y="608" class="body">test_data_quality.py / test_reporting.py</text>


<rect x="1030" y="470" width="280" height="220" class="box"/>
<text x="1048" y="498" class="small">main.py</text>
<text x="1048" y="518" class="body">Application launcher</text>
<text x="1048" y="536" class="body">Convenient local entry point</text>
<text x="1048" y="554" class="body">Runs the Streamlit interface</text>

<line x1="340" y1="245" x2="390" y2="245" class="arrow"/>
<line x1="670" y1="245" x2="720" y2="245" class="arrow"/>
<line x1="1020" y1="245" x2="1070" y2="245" class="arrow"/>
<line x1="530" y1="580" x2="620" y2="580" class="arrow2"/>
<line x1="950" y1="580" x2="1030" y2="580" class="arrow2"/>
<line x1="530" y1="220" x2="530" y2="470" class="arrow"/>
<line x1="860" y1="220" x2="860" y2="470" class="arrow"/>
<line x1="1170" y1="370" x2="1170" y2="470" class="arrow"/>
</svg>